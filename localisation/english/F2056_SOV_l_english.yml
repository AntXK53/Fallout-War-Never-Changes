 SOV_foreigh_policy_idea: "Soviet foreigh policy"
 SOV_foreigh_policy_idea_desc: "Since the 2000s, the Union of Soviet Socialist Republics has pursued a unique “neutral” foreign policy, prioritizing global collective security and friendly relations with the United States in exchange for the cessation of anti-American propaganda and a shift toward China. The USSR began cooperating with the U.S. and jointly participating in conflicts on the world stage. By 2056, this policy had failed due to the outbreak of the European-Middle Eastern War in 2052 and the subsequent collapse of the UN, leading to the development of a policy of isolationism by the USSR and the Eastern Bloc, and support for states hostile to Europe and China, such as the United Arab Republic and the Republic of India"
 SOV_full_war_ready_idea: "Full combat readiness"
 SOV_full_war_ready_idea_desc: "As of 2056, the USSR is in a state of military mobilization and preparing its army for a defensive war. Following a nuclear strike on Tel Aviv, it becomes clear that even possessing nuclear weapons will not save the country from a major conflict, as demonstrated by the European-Middle Eastern War. The Soviet Union is bracing for war with China, the United States, or Europe, which may attack it in order to seize the USSR’s oil"
 SOV_militarist_policy_idea: "Domestic military policy"
 SOV_militarist_policy_idea_desc: "Following the National Bolshevik attempts on Artem Zaitsev’s life in 2030 and the ensuing domestic instability in the USSR and around the world, Soviet generals began to play a more active role in politics. Ultimately, in 2045, Vasily Kozlov, the USSR’s Minister of Defense, came to power after winning the election to the Supreme Soviet of the USSR. His policies continued Ivan Ushakov’s ideas of strengthening control over Eastern Europe, increasing state ownership in the economy, and promoting Soviet patriotism. Reformers seeking to restore the USSR of the 2000s are dissatisfied with him, but under his leadership, the people of the USSR do not fear being destroyed as a result of global instability"

