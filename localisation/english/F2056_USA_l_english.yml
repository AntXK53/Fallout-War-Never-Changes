 USA_military_focus_event_title:0 "Military Priorities"
 USA_military_focus_event_desc:0 "Our military leadership is debating where to focus our efforts. Each branch demands attention and resources."
 USA_military_focus_army:0 "Prioritize the Army"
 USA_military_focus_air:0 "Prioritize the Air Force"
 USA_military_focus_navy:0 "Prioritize the Navy"
 USA_navy_focus_event_title:0 "Rising as a Global Naval Power"
 USA_navy_focus_event_desc:0 "With the completion of our focus on expanding the navy, the United States now commands a fleet capable of projecting power across the oceans. Our ships, sailors, and naval infrastructure have reached unprecedented strength, ensuring our influence on the world stage."
 global_navy:0 "WE ARE THE NAVY "
 usa_focus_pacific_rim:0 "Pacific Rim Defenses"
 usa_focus_pacific_rim_desc:0 "Fortify the Pacific coast against Chinese naval power. Expand our ports, harden our shores, and prepare the Northwest for the war we hope never comes."

 usa_focus_northern_frontier:0 "Northern Frontier Watch"
 usa_focus_northern_frontier_desc:0 "Build a radar and air defense network across our northern states. If China ever strikes from across the Pole, we'll see it coming."

 USA_northern_states:0 "Secure the Northern States"
 USA_northern_states_desc:0 "Our northern territories remain dangerously exposed, both by sea and by air. Before tensions with China boil over, Washington must invest in their defense — securing the Pacific coast and watching the skies to the north."

 USA_texas_commonwealth:0 "The Texas Commonwealth"
 USA_texas_commonwealth_desc:0 "Texas sits atop some of the richest oil and gas reserves in the country, largely untouched since the reserves were first surveyed decades ago. With energy demand only climbing and tensions abroad threatening our supply lines, Washington can no longer afford to leave that wealth in the ground.\n\nInvestment in the Texas Commonwealth's extraction industry could secure our energy independence for a generation — provided we're willing to commit the capital."

 usa_focus_energy_expansion:0 "Texan Energy Expansion"
 usa_focus_energy_expansion_desc:0 "Drill deeper, build wider. With federal backing, Texas oil fields can be brought to full production, feeding refineries and reactors from coast to coast and fr USA_midwest_commonwealth_desc:0 "The Midwest was once the industrial heart of America, but decades of neglect have left its factories aging and its infrastructure crumbling. If the Commonwealth is to pull its weight in the coming years, it needs to be rebuilt from the ground up."

 USA_midwest_commonwealth:0 "The Midwest Commonwealth"
 USA_midwest_commonwealth_desc:0 "The Midwest was once the industrial heart of America, but decades of neglect have left its factories aging and its infrastructure crumbling. If the Commonwealth is to pull its weight in the coming years, it needs to be rebuilt from the ground up."

 usa_focus_heartland_reindustrialization:0 "Heartland Reindustrialization"
 usa_focus_heartland_reindustrialization_desc:0 "Federal investment pours back into the Midwest, modernizing factories and rebuilding the roads and rails that connect them. The heartland rises again."
 USA_four_corners_commonwealth:0 "The Four Corners Commonwealth"
 USA_four_corners_commonwealth_desc:0 "Arizona, Utah, Colorado, and New Mexico form one of the most exposed stretches of our southern border. With raiders, smugglers, and foreign agitators testing our defenses more each year, these states can no longer be left to fend for themselves."

 usa_focus_border_reinforcement:0 "Border Reinforcement"
 usa_focus_border_reinforcement_desc:0 "Federal engineers begin work on a chain of hardened bunkers along the southern frontier, giving our garrisons the fortifications they need to hold the line against whatever comes across the border."

 USA_california_commonwealth:0 "The Southwest Commonwealth"
 USA_california_commonwealth_desc:0 "California and the desert states hold vast untapped mineral wealth, but decades of underinvestment have left the region's potential locked away beneath the sand. If the Southwest is to become a true engine of American industry, Washington must commit to developing it in earnest."

 usa_focus_desert_expansion:0 "Desert Expansion"
 usa_focus_desert_expansion_desc:0 "Federal contractors push out into the Nevada desert, breaking ground on new aluminium refineries and processing plants. What was once empty wasteland will soon feed the nation's factories."

 USA_great_plains_commonwealth:0 "The Plains Commonwealth"
 USA_great_plains_commonwealth_desc:0 "Our supply lines across the Plains are choked by aging roads and half-abandoned rail lines. Convoys crawl where they should run, and reinforcements arrive late when they arrive at all. Modernizing this network is long overdue."

 usa_focus_rails:0 "Rail and Road Modernization"
 usa_focus_rails_desc:0 "New track is laid and old roads repaved across the heartland, giving our supply trains the speed they've always lacked. The grain, the steel, and the soldiers will finally move as fast as the nation needs them to."
