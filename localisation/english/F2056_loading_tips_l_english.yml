l_english:
 LOADING_TIP_0:0 "Conservation means the wise use of the earth and its resources for the lasting good of men."
 LOADING_TIP_1:0 "Did you ever try to put a broken piece of glass together? Even if the pieces fit, you can't make it whole again the way it was. But if you're clever, you can still use the pieces to make other useful things. Maybe, something wonderful, like a mosaic. Well, the world broke like glass - Moira Brown"
 LOADING_TIP_2:0 "Swelterin' tropics, ferals prowling in the sun, and locals that'll eat ya as soon as look at you - and that was before the Bombs - Daniel McArthur"
 LOADING_TIP_3:0 "If you want to see the fate of democracies, look out the window."
 LOADING_TIP_4:0 "To have done the things I have done in the name of progress and healing. It was madness. - The Master"
 LOADING_TIP_5:0 "Fucking Hollywood Reds. I’m telling you, radicalism is sweeping through Hollywood like a bad case of the clap. - Sebastian Leslie"
 LOADING_TIP_6:0 "He who conquers himself is the mightiest warrior."
 LOADING_TIP_7:0 "Nuclear energy was the dominant power source, leading to widespread use of atomic-powered appliances, vehicles, and robots like Mr. Handy"
 LOADING_TIP_8:0 "There is but one evil, war. All the other proclaimed evils such as hate, greed, discrimination, and jealousy are only sub-categories of it.""
 LOADING_TIP_9:0 "I use the pen, because the pen is mightier than the sword. But you always have to keep the sword handy for when the pen fails."
 LOADING_TIP_10:0 "On January 28, 2077, P.A.M. predicted that there would be a 12% chance of the DEFCON level increasing within the month"
 LOADING_TIP_11:0 "**\"**Your answer does not logically follow. An ideal nuclear first strike scenario would still leave 59% of the American nuclear stockpile free for retaliation. Posit. You cannot conquer what is destroyed. - P.A.M**\"**"
 LOADING_TIP_12:0 "Our country has gone to heck in a hand basket. The big kaboom is... it's inevitable... and coming sooner than you may think. - Vault-Tec Rep"
 LOADING_TIP_13:0 "**\"**Welcome to Anchorage, soldier! Fight like you mean it, and we'll have you home by Christmas!**\"**"
 LOADING_TIP_14:0 "The Mister Gutsy model of robot was commissioned by the U.S. Army just before the atomic apocalypse of 2077."
 LOADING_TIP_15:0 "The sturdy Protectron model of robot was created before the great war, and served as a security automaton in both the private and business sectors."
 LOADING_TIP_16:0 "The Robobrain, constructed by General Atomics International before the great nuclear war, is unique in that it uses an actual organic brain as its central processor."
 LOADING_TIP_17:0 "We make war that we may live in peace."
 LOADING_TIP_18:0 "It doesn't matter if a cat is black or white, so long as it catches mice"
 LOADING_TIP_19:0 "The proletarians have nothing to lose but their chains"
 LOADING_TIP_20:0 "But if thought corrupts language, language can also corrupt thought."
 LOADING_TIP_21:0 "Patrolling the Mojave almost makes you wish for a nuclear winter."
 LOADING_TIP_22:0 "Every inhabitant of this planet must contemplate the day when this planet may no longer be habitable."
 LOADING_TIP_23:0 "Look at the scorched earth and the bones that litter the wasteland. Millions... perhaps even billions, died because science outpaced man's restraint! - Arthur Maxson"
 LOADING_TIP_24:0 "Don't think of them as human beings. Think of them as Americans. - Joan Harper"
 LOADING_TIP_25:0 "I'm not a communist, Mr. Howard. That's just a dirty word they use to describe people who aren't insane. - Kate Williams"