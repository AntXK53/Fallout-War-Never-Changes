  Social_Democrat:0 "Social Democracy"
  Social_Democrat_noun:0 "Social Democrat"
  Social_Democrat_desc:0 "Social Democracy seeks to balance political freedom with economic equality through democratic governance. While maintaining a capitalist framework, the state plays an active role in regulating markets, providing social welfare, and reducing inequality. Strong institutions, labor protections, and public services are emphasized to ensure a high standard of living and social stability. Individual rights are preserved alongside collective responsibility, aiming to create a fair and inclusive society without resorting to authoritarian control."
