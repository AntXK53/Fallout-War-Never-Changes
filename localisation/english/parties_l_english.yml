  communism:0 "Authoritarian Communism"
  communism_noun:0 "Authoritarian Communist"
  communism_desc:0 "The revolution gradually centralized as the need for stability and direction replaced its earlier mass-driven character. Authority became concentrated in the state, which now acts as the sole guardian of revolutionary ideals and enforces unity while suppressing dissent. Economic and social life are organized collectively, with an emphasis on industrial output, discipline, and cohesion. Individual freedoms are limited in favor of maintaining order, strengthening the state, and ensuring the continuity of the revolutionary project."
