  Civilian_Dictatorship:0 "Civilian Dictatorship"
  Civilian_Dictatorship_noun:0 "Civilian Dictator"
  Civilian_Dictatorship_desc:0 "A Civilian Dictatorship is a form of authoritarian rule in which power is concentrated in the hands of a non-military leader or ruling party. Political opposition is restricted or suppressed, and governance is maintained through centralized authority, control of institutions, and limited public participation. While lacking direct military control, the regime relies on bureaucratic structures, security forces, and political networks to maintain stability. Civil liberties are often curtailed in favor of order, regime continuity, and the consolidation of power."
  Corporatocracy:0 "Corporatocracy"
  Corporatocracy_noun:0 "Corporatocrat"
  Corporatocracy_desc:0 "Corporatocracy is a system in which political power is heavily influenced or directly controlled by corporate interests. Economic elites and large enterprises play a central role in shaping policy, often prioritizing growth, efficiency, and profitability. The state may act in alignment with business interests, blurring the line between public governance and private power. While this can drive economic development and innovation, it may also limit political equality, reduce accountability, and sideline the interests of the broader population."
  Right_Wing_Eurasianism:0 "Right-Wing Eurasianism"
  Right_Wing_Eurasianism_noun:0 "Right-Wing Eurasianist"
  Right_Wing_Eurasianism_desc:0 "Right-Wing Eurasianism needs Description"
  Islamic_Nationalism:0 "Islamic Nationalism"
  Islamic_Nationalism_noun:0 "Islamic Nationalist"
  Islamic_Nationalism_desc:0 "Islamic Nationalism combines religious identity with national unity, positioning Islam as a central component of the state’s political and social framework. Governance draws upon Islamic principles while promoting national cohesion, often blending modern state structures with religious authority. Laws and policies may reflect religious values alongside national interests, shaping public life and cultural identity. While this approach can strengthen unity and legitimacy among the faithful, it may limit pluralism and restrict the role of secular or minority perspectives."
  Military_Junta:0 "Military Junta"
  Military_Junta_noun:0 "Juntist"
  Military_Junta_desc:0 "A Military Junta is a form of governance in which political power is held by the armed forces, typically following the suspension or removal of civilian rule. Authority is centralized among senior officers, with an emphasis on order, stability, and national security. Civil liberties and political opposition are often restricted to maintain control and prevent unrest. Governance prioritizes discipline and cohesion, though it may lack long-term political legitimacy and broad public participation."
  Technocracy:0 "Technocracy"
  Technocracy_noun:0 "Technocrat"
  Technocracy_desc:0 "Technocracy places governance in the hands of technical experts, administrators, and specialists rather than elected representatives. Decision-making is guided by data, efficiency, and long-term planning, with an emphasis on scientific and economic management of society. Political debate and partisan interests are minimized in favor of pragmatic solutions and measurable outcomes. While this approach can enhance stability and development, it often limits popular participation and reduces the role of traditional democratic processes."
  Feral_Ghoulism:0 "Feral Ghoulism"
  Feral_Ghoulism_noun:0 "Feral Ghoulist"
  Feral_Ghoulism_desc:0 "Feral Ghoulism needs Description"
  democratic:0 "Liberalism"
  democratic_noun:0 "Liberal"
  democratic_desc:0 "Liberalism emphasizes individual freedom, political pluralism, and the protection of civil rights within a democratic framework. The state is limited in scope, focusing on upholding the rule of law, safeguarding liberties, and maintaining fair and open institutions. Markets operate largely freely, with minimal intervention beyond ensuring competition and stability. Governance is based on representation, consent, and the protection of minority rights, aiming to preserve both personal autonomy and political stability."
  Christian_Liberalism:0 "Christian Liberalism"
  Christian_Liberalism_noun:0 "Christian Liberal"
  Christian_Liberalism_desc:0 "Christian Liberalism combines Christian ethical principles with a commitment to democratic governance and individual rights. It supports political freedom, social justice, and the protection of civil liberties, while drawing moral guidance from Christian teachings. The state remains generally secular in structure but is influenced by values such as compassion, human dignity, and social responsibility. This approach seeks to balance faith with pluralism, promoting both personal freedom and a socially conscious political order."
  Classical_Liberalism:0 "Classical Liberalism"
  Classical_Liberalism_noun:0 "Classical Liberal"
  Classical_Liberalism_desc:0 "Classical Liberalism needs Description"
  social_liberalism:0 "Social Liberalism"
